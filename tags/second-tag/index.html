* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #020207;
  font-family: Arial, sans-serif;
}

.background {
  position: fixed;
  inset: 0;
  overflow: hidden;

  background:
    radial-gradient(
      circle at 50% 40%,
      rgba(35, 10, 70, 0.35),
      transparent 35%
    ),
    radial-gradient(
      circle at 80% 20%,
      rgba(0, 150, 255, 0.12),
      transparent 30%
    ),
    linear-gradient(
      180deg,
      #010107 0%,
      #050312 50%,
      #020207 100%
    );
}

/* =========================
   STARS
========================= */

.stars,
.stars::before,
.stars::after {
  position: absolute;
  inset: 0;
  content: "";
  background-image:
    radial-gradient(circle, white 1px, transparent 1px),
    radial-gradient(circle, #9c7cff 1px, transparent 1px),
    radial-gradient(circle, #4ddcff 1px, transparent 1px);

  background-size:
    97px 113px,
    157px 181px,
    223px 197px;

  background-position:
    10px 20px,
    50px 80px,
    100px 30px;

  opacity: 0.35;
}

.stars::before {
  transform: scale(1.3);
  opacity: 0.2;
}

.stars::after {
  transform: scale(1.7);
  opacity: 0.12;
}

/* =========================
   NEON GLOWS
========================= */

.glow {
  position: absolute;
  border-radius: 50%;
  filter: blur(90px);
  pointer-events: none;
}

.glow-1 {
  width: 500px;
  height: 500px;
  left: -180px;
  top: 10%;

  background: rgba(92, 0, 255, 0.22);
}

.glow-2 {
  width: 450px;
  height: 450px;
  right: -150px;
  top: 20%;

  background: rgba(0, 180, 255, 0.18);
}

/* =========================
   PLANET
========================= */

.planet {
  position: absolute;

  width: 520px;
  height: 520px;

  left: 50%;
  top: 35%;

  transform: translate(-50%, -50%);

  border-radius: 50%;

  background:
    radial-gradient(
      circle at 35% 30%,
      rgba(255,255,255,0.25),
      transparent 8%
    ),
    radial-gradient(
      circle at 40% 40%,
      #241050,
      #09031c 55%,
      #010107 72%
    );

  box-shadow:
    0 0 40px rgba(113, 45, 255, 0.25),
    inset -60px -30px 100px rgba(0,0,0,0.9);

  opacity: 0.75;
}

/* planet atmosphere */

.planet::before {
  content: "";

  position: absolute;
  inset: -12px;

  border-radius: 50%;

  border: 2px solid rgba(120, 70, 255, 0.25);

  box-shadow:
    0 0 30px rgba(120, 50, 255, 0.25),
    0 0 80px rgba(0, 180, 255, 0.08);
}

/* =========================
   PERSPECTIVE GRID
========================= */

.grid {
  position: absolute;

  width: 200%;
  height: 60%;

  left: -50%;
  bottom: -15%;

  transform:
    perspective(350px)
    rotateX(62deg);

  transform-origin: center bottom;

  background-image:
    linear-gradient(
      rgba(70, 30, 255, 0.28) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(0, 190, 255, 0.22) 1px,
      transparent 1px
    );

  background-size:
    55px 55px,
    55px 55px;

  mask-image: linear-gradient(
    to top,
    black,
    transparent 90%
  );

  -webkit-mask-image: linear-gradient(
    to top,
    black,
    transparent 90%
  );
}
